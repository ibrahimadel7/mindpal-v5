# Development docker-compose
# Usage: docker compose up --build
# Secrets: create backend/.env from .env.example and set GROQ_API_KEY there (never commit)

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindpal-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - mindpal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Security: limit capabilities, read-only rootfs where possible
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    volumes:
      - mindpal-chroma-data:/app/chroma_data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindpal-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "80:80"
    networks:
      - mindpal
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  mindpal:
    driver: bridge

volumes:
  mindpal-chroma-data:
    driver: local
