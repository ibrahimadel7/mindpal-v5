name: Deploy MindPal

on:
  push:
    branches: [deployment]

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  WORKER_NAME: mindpal-backend
  PAGES_PROJECT: mindpal-frontend
  WORKER_DIR: worker
  FRONTEND_DIR: frontend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Lint frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm ci
          npm run lint

  deploy-backend:
    needs: lint-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mindpal-backend.ibrahimadelabdelaziz.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci --legacy-peer-deps

      - name: Type check
        working-directory: ${{ env.WORKER_DIR }}
        run: npx tsc --noEmit

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify
          workingDirectory: ${{ env.WORKER_DIR }}

      - name: Set Groq API Key secret
        run: |
          wrangler secret put GROQ_API_KEY <<< '${{ secrets.GROQ_API_KEY }}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}

  deploy-frontend:
    needs: lint-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mindpal-frontend.ibrahimadelabdelaziz.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mindpal-backend.ibrahimadelabdelaziz.workers.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.PAGES_PROJECT }}
          directory: ${{ env.FRONTEND_DIR }}/dist

  notify:
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment status
        run: |
          echo "Backend: ${{ needs.deploy-backend.result }}"
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
